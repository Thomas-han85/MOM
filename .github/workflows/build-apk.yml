name: APK 빌드

# main 에 푸시하거나 Actions 탭에서 직접 실행하면 APK 가 나온다.
#
# 화면과 기능만 고쳤다면 APK 를 다시 깔 필요가 없다.
# 앱이 www/app.html 을 깃허브에서 직접 받아 가므로, 앱을 껐다 켜면 반영된다.
# APK 를 다시 깔아야 하는 것은 native/ 아래와 앱 이름을 고쳤을 때뿐이다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 앱을 고쳐 놓고 버전을 안 올리면 기기가 갱신을 받지 못한다.
      # 이 실수가 제일 잦으므로 여기서 막는다.
      - name: APP_VERSION 올렸는지 확인
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "첫 커밋이다. 검사를 건너뛴다."; exit 0
          fi
          if git diff --quiet HEAD~1 HEAD -- www/app.html; then
            echo "app.html 변경 없음. 검사를 건너뛴다."; exit 0
          fi
          OLD=$(git show HEAD~1:www/app.html | sed -n 's/.*APP_VERSION *= *"\([^"]*\)".*/\1/p' | head -1)
          NEW=$(sed -n 's/.*APP_VERSION *= *"\([^"]*\)".*/\1/p' www/app.html | head -1)
          if [ -z "$NEW" ]; then
            echo "::error::www/app.html 에서 APP_VERSION 을 찾지 못했다."; exit 1
          fi
          if [ "$OLD" = "$NEW" ]; then
            echo "::error::app.html 을 고쳤는데 APP_VERSION 이 그대로다 ($NEW). 값을 올려야 기기가 새 버전을 받는다."
            exit 1
          fi

          # 앞 버전을 복사해 뒤 숫자만 올리다 보면 날짜가 며칠 전에 멈춰 있게 된다.
          # 그러면 버전만 봐서는 언제 고친 것인지 알 수 없다.
          # 깃허브는 세계시로 도는데 우리는 한국에서 고치므로 서울 시각으로 본다.
          TODAY=$(TZ=Asia/Seoul date +%Y.%m.%d)
          case "$NEW" in
            "$TODAY"-*)
              ;;
            *)
              echo "::error::APP_VERSION 의 날짜가 오늘이 아니다. 지금 값은 $NEW, 오늘은 $TODAY (서울 기준)."
              echo "::error::www/app.html 의 APP_VERSION 을 \"$TODAY-1\" 로 고쳐라. 오늘 이미 올린 적이 있으면 뒤 숫자를 하나 올려라."
              exit 1
              ;;
          esac

          echo "버전 $OLD -> $NEW (오늘 $TODAY)"

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install

      - name: 안드로이드 프로젝트 생성 + 네이티브 주입
        run: |
          npx cap add android
          node scripts/apply-native.js

      # 빌드마다 서명이 달라지면 안드로이드가 다른 앱으로 보고 덮어쓰기 설치를 막는다.
      # 고정 키를 secret 에 넣어 두고 매번 같은 것으로 서명한다.
      # build.gradle 이 android/app/signing.keystore 를 직접 가리키므로 그 자리에 둔다.
      - name: 고정 서명키 복원
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret 이 없다. 서명이 매번 달라져 덮어쓰기 설치가 막힌다."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          echo "$KS" | base64 -d > android/app/signing.keystore
          echo "고정 키스토어 복원 완료"
          keytool -list -v -keystore android/app/signing.keystore \
                  -alias androiddebugkey -storepass android 2>/dev/null \
            | grep -E "SHA1:" || echo "키스토어를 읽지 못함"

      - name: 주입 결과 확인
        run: |
          echo "--- AndroidManifest 권한/서비스 ---"
          grep -E "uses-permission|RecorderService" android/app/src/main/AndroidManifest.xml
          echo "--- MainActivity ---"
          cat android/app/src/main/java/com/handong/meetnote/MainActivity.java
          echo "--- 서명 설정 ---"
          grep -A 8 "signingConfigs" android/app/build.gradle || echo "서명 설정 없음"

      - name: Gradle 빌드
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --stacktrace

      # APK 에 실제로 박힌 서명을 찍는다. 이 값이 빌드마다 같아야 덮어쓰기가 된다.
      - name: 서명 지문 확인
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          echo "--- APK 에 박힌 서명 ---"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "SHA-1|SHA-256" || echo "apksigner 실패"

      - name: APK 이름 정리
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             out/transmom-${{ github.run_number }}.apk

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: transmom-apk
          path: out/*.apk
          retention-days: 30

      # 릴리스로도 남긴다. 폰 브라우저에서 바로 내려받을 수 있다.
      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" out/*.apk \
            --title "APK ${{ github.run_number }}" \
            --notes "화면·기능만 바뀌었다면 다시 깔 필요 없다. 앱을 껐다 켜면 반영된다. native/ 나 앱 이름이 바뀐 경우에만 이 APK 를 설치하면 된다."
