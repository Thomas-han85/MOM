<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>대역 · 회의 기록</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--
  이 파일은 앱이 아니다. 깃허브 페이지 주소로 들어온 사람을 실제 부트로더로 보낸다.
  앱 본체는 www/app.html 이고, 부트로더 www/index.html 이 그것을 받아 실행한다.
  예전에는 여기에 앱 통짜 복사본이 들어 있어서, 랩탑으로 접속하면 낡은 화면이 떴다.
-->
<meta http-equiv="refresh" content="0; url=./www/">
<link rel="canonical" href="./www/">
<style>
  body{margin:0;display:grid;place-items:center;height:100vh;background:#F7F6F3;color:#55524C;
       font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;font-size:14px}
  a{color:#1C1B19}
</style>
<body>
  <p>앱을 여는 중… 열리지 않으면 <a href="./www/">여기를 눌러라</a>.</p>
  <script>location.replace("./www/");</script>
</body>
</html>
