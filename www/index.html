<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3">
<title>실시간번역+회의록작성 sys</title>
<style>
  html,body{margin:0;height:100%;background:#F7F6F3;color:#1C1B19;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif}
  #boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
  #boot h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
  #boot p{margin:0;font-size:13.5px;color:#8B877E;text-align:center;line-height:1.6;max-width:300px}
  #boot button{margin-top:10px;padding:12px 22px;border:1px solid #DFDCD4;border-radius:11px;
    background:#fff;font:inherit;font-size:14px;color:#1C1B19}
</style>
</head>
<body>
<div id="boot">
  <h1>실시간번역 + 회의록작성</h1>
  <p id="bmsg"></p>
</div>

<script>
/* =====================================================================
   부트로더

   앱 본체(app.html)는 깃허브에서 받아 온다. 코드를 고치고 push 하면
   앱을 껐다 켜는 것만으로 반영된다. APK 를 다시 깔 필요가 없다.

   안전장치가 핵심이다.
     - 받아 온 파일이 성한지 검사한 뒤에만 저장한다
     - 새 버전은 받아만 두고 "다음 실행" 에 적용한다. 쓰는 도중에 화면이 갈리면 안 된다
     - 기동 중에 플래그를 세우고, 앱이 끝까지 뜨면 푼다.
       플래그가 남은 채로 다시 켜졌다면 지난 기동이 실패한 것이므로
       받아 온 것을 버리고 APK 에 들어 있는 원본으로 되돌린다
   ===================================================================== */
(function(){
"use strict";

var SRC_DEFAULT = "https://raw.githubusercontent.com/Thomas-han85/MOM/main/www/app.html";

var K_APP = "mn_app", K_VER = "mn_ver", K_FLAG = "mn_booting", K_SRC = "mn_src";

var ls = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } },
  del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
};

function msg(t){ var e = document.getElementById("bmsg"); if(e) e.textContent = t; }

function versionOf(html){
  var m = String(html).match(/APP_VERSION\s*=\s*"([^"]+)"/);
  return m ? m[1] : "";
}

/* 받아 온 파일이 진짜 앱인지 확인한다. 통신사 안내 페이지나 잘린 응답을 걸러낸다. */
function sane(html){
  return typeof html === "string"
      && html.length > 30000
      && html.indexOf("MEETNOTE_APP") >= 0
      && html.indexOf("</html>") > 0
      && versionOf(html) !== "";
}

function srcUrl(){ return ls.get(K_SRC) || SRC_DEFAULT; }

/* 원격에서 받아 검사한 뒤 저장한다. 적용은 다음 실행이다. */
function check(){
  return fetch(srcUrl() + "?t=" + Date.now(), { cache: "no-store" })
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function(text){
      if(!sane(text)) return { status:"bad", message:"받은 파일이 온전하지 않다. 갱신하지 않았다." };
      var v = versionOf(text);
      if(v === window.__mnUpdate.current) {
        window.__mnUpdate.checked = true;
        return { status:"latest", version:v };
      }
      if(!ls.set(K_APP, text)) return { status:"bad", message:"저장 공간이 부족하다." };
      ls.set(K_VER, v);
      window.__mnUpdate.pending = v;
      window.__mnUpdate.checked = true;
      return { status:"updated", version:v };
    })
    .catch(function(e){ return { status:"error", message:String(e.message || e) }; });
}

function revert(){
  ls.del(K_APP); ls.del(K_VER);
  window.__mnUpdate.pending = "";
}

function run(html, fromCache){
  window.__mnUpdate = {
    current: versionOf(html),
    pending: "",
    checked: false,
    fromCache: !!fromCache,
    src: srcUrl(),
    check: check,
    revert: revert,
    setSrc: function(u){ ls.set(K_SRC, u); window.__mnUpdate.src = u; }
  };

  // 앱이 끝까지 뜨면 이걸 부른다. 안 불리면 다음 기동에서 원본으로 되돌린다.
  ls.set(K_FLAG, "1");
  window.__mnBootOK = function(){ ls.del(K_FLAG); };

  document.open();
  document.write(html);
  document.close();

  // 화면이 자리를 잡은 뒤 조용히 확인한다.
  setTimeout(function(){
    check().then(function(){
      try { window.dispatchEvent(new Event("mn-update")); } catch(e){}
    });
  }, 4000);
}

function loadBundled(){
  return fetch("app.html", { cache: "no-store" }).then(function(r){ return r.text(); });
}

function boot(){
  // 지난 기동이 끝까지 못 갔다. 받아 온 것이 문제였을 가능성이 크다.
  if(ls.get(K_FLAG) === "1"){
    ls.del(K_APP); ls.del(K_VER); ls.del(K_FLAG);
    msg("지난번 실행이 실패해서 설치된 버전으로 되돌린다…");
  }

  var cached = ls.get(K_APP);
  if(sane(cached)){ run(cached, true); return; }

  ls.del(K_APP); ls.del(K_VER);
  loadBundled().then(function(html){
    if(!sane(html)) throw new Error("앱 파일이 손상됐다");
    run(html, false);
  }).catch(function(e){
    msg("앱을 열지 못했다. " + (e.message || e));
    var b = document.createElement("button");
    b.textContent = "다시 시도";
    b.onclick = function(){ location.reload(); };
    document.getElementById("boot").appendChild(b);
  });
}

boot();
})();
</script>
</body>
</html>
